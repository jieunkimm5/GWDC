[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gwdc-kiln-router"
version = "0.1.0"
description = "Kiln-powered inference routing module for GWDC"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
include = ["kiln_router*"]
